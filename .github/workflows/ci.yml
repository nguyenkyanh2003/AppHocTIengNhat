name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: BackEnd (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BackEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-value-at-least-32-characters
          MONGODB_URI: mongodb://127.0.0.1:27017/ci-placeholder

  flutter:
    name: FrontEnd (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      # Web là mục tiêu phát hành ngang hàng với mobile, nên bản dựng web phải
      # được máy kiểm mỗi lần đẩy code — không để nó vỡ âm thầm rồi phát hiện
      # lúc chuẩn bị demo.
      - name: Build web
        run: flutter build web --release

      # Điều hướng bằng URL chỉ tồn tại trên trình duyệt: link trực tiếp, nút
      # Back, và link đặt lại mật khẩu trong email. Test widget không chạm tới
      # được, nên phải chạy trong Chrome thật.
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Start ChromeDriver
        run: chromedriver --port=4444 &

      # Bộ này cố ý chỉ kiểm luồng **chưa đăng nhập** nên không cần backend:
      # không có token thì `AuthProvider.init()` không gọi mạng lần nào.
      - name: Web integration tests
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/web_navigation_test.dart -d web-server --browser-name=chrome --headless
