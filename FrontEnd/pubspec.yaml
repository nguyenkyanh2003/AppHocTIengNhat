name: apphoctiengnnhat
description: App học tiếng Nhật
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & Storage
  http: ^1.1.0
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^9.2.4
  
  # Image Picker
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_html: ^3.0.0-beta.2
  fl_chart: ^0.65.0
  
  # Audio
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.0
  
  # Utilities
  http_parser: ^4.1.2
  intl: ^0.19.0
  path: ^1.9.1
  url_launcher: ^6.2.1
  web: ^1.1.1

dependency_overrides:
  # Keep record platform pieces aligned to avoid missing startStream implementation
  record_linux: ^1.2.1
  record_platform_interface: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/  
